<style>
  :root {
    --paper: #FBF7EE;
    --paper-line: #E4DCC6;
    --ink: #2B2A26;
    --ink-soft: #6B6858;
    --basil: #4C7A5E;
    --basil-dark: #345644;
    --basil-light: #E4EEE7;
    --mustard: #E0A73B;
    --mustard-dark: #8A5F17;
    --tomato: #C24A3C;
    --tomato-light: #F7E4E0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    overscroll-behavior-y: contain;
  }
  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 43px,
      var(--paper-line) 43px, var(--paper-line) 44px
    );
    background-position: 0 118px;
  }
  header {
    padding: 28px 20px 14px;
    background: var(--paper);
    position: sticky; top: 0; z-index: 5;
    border-bottom: 1px solid var(--paper-line);
  }
  h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    color: var(--basil-dark);
    line-height: 1;
  }
  .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--basil); flex-shrink: 0; }
  .dot.off { background: #C9C4B0; }

  .header-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .header-btn-group {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--tomato);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 0;
    cursor: pointer;
    display: none;
    white-space: nowrap;
  }
  .clear-btn.show { display: inline-block; }
  .edit-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    padding: 4px 0 4px 10px;
    cursor: pointer;
    position: relative;
  }
  .edit-btn.active { color: var(--basil); }

  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 2px 0;
    margin-bottom: -2px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink-soft);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .chip i { font-size: 14px; }
  .chip.active {
    background: var(--basil);
    border-color: var(--basil);
    color: #fff;
  }
  .chip.add {
    color: var(--mustard-dark);
    border-style: dashed;
  }
  .chip .chip-del {
    margin-left: 2px;
    font-size: 13px;
    line-height: 1;
  }
  .chip.removable { border-color: var(--tomato); color: var(--tomato); }

  main {
    flex: 1;
    padding: 4px 16px 140px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--basil-dark);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 14px 4px 2px;
  }
  .section-title.checked { color: var(--ink-soft); }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty i { font-size: 32px; color: #C9C4B0; margin-bottom: 10px; display: block; }
  .empty p { margin: 4px 0; font-size: 15px; }
  .empty .hint { font-size: 13px; color: #A29E8C; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 4px;
    height: 44px;
  }
  .check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--basil);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    transition: background .15s, border-color .15s;
    cursor: pointer;
  }
  .check svg { color: var(--paper); opacity: 0; transition: opacity .1s; }
  .item.done .check { background: var(--basil); }
  .item.done .check svg { opacity: 1; }
  .item-text {
    flex: 1;
    font-size: 16px;
    line-height: 1.3;
    word-break: break-word;
  }
  .item-cat {
    font-size: 15px;
    color: var(--ink-soft);
    flex-shrink: 0;
    width: 18px;
    text-align: center;
  }
  .item.done .item-cat { color: #C9C4B0; }
  .item.done .item-text { color: #A29E8C; text-decoration: line-through; }
  .item-meta {
    font-size: 11px;
    color: #B3AF9C;
    flex-shrink: 0;
  }
  .del-btn {
    background: none; border: none; color: #C9C4B0; font-size: 18px;
    padding: 6px; cursor: pointer; flex-shrink: 0;
  }
  .del-btn:active { color: var(--tomato); }

  .addbar {
    position: sticky;
    bottom: 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--paper) 70%, transparent);
  }
  .notify-text-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: var(--mustard);
    color: #fff;
    border-radius: 12px;
    padding: 5px 12px 5px 10px;
  }
  .notify-badge {
    display: none;
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 15px;
    height: 15px;
    padding: 0 3px;
    border-radius: 8px;
    background: var(--tomato);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 15px;
    text-align: center;
  }
  .notify-badge.show { display: block; }
  .addbar-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 26px;
    padding: 6px 6px 6px 18px;
    box-shadow: 0 2px 10px rgba(43,42,38,0.08);
  }
  #text-input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    background: transparent;
    color: var(--ink);
    height: 34px;
  }
  #text-input::placeholder { color: #B3AF9C; }
  .lang-btn {
    flex-shrink: 0;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink-soft);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--mustard);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
  }
  .mic-btn.listening { background: var(--tomato); }
  .mic-btn.listening::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--tomato);
    animation: pulse 1.1s ease-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0% { transform: scale(0.8); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--basil);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity .15s, transform .15s;
    pointer-events: none;
  }
  .send-btn.show { opacity: 1; transform: scale(1); pointer-events: auto; }

  .toast {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%) translateY(-40px);
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 20px;
    opacity: 0;
    transition: transform .25s, opacity .25s;
    z-index: 20;
    white-space: nowrap;
    max-width: 88%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .noscript-banner {
    margin: 10px 16px 0;
    background: var(--tomato-light);
    color: #7A3226;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
  }

  #setup-screen {
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--paper);
  }
  .setup-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .setup-title {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--basil-dark);
    margin: 0 0 6px;
  }
  .setup-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 24px;
  }
  .setup-code-input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    padding: 13px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    text-align: center;
    margin-bottom: 10px;
    background: #fff;
  }
  .setup-join-btn {
    width: 100%;
    background: var(--mustard);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .setup-error {
    color: var(--tomato);
    font-size: 13px;
    margin: 12px 0 0;
    min-height: 16px;
  }

  .account-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .code-pill {
    padding: 2px 8px;
    background: var(--basil-light);
    color: var(--basil-dark);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .switch-list-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 11px;
    text-decoration: underline;
    padding: 0;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="setup-screen">
  <div class="setup-card">
    <h1 class="setup-title">Talk & Shop List</h1>
    <p class="setup-sub" id="setup-sub">Enter your phone number or email — this becomes your personal list. Use the same one next time to come back to it.</p>
    <input class="setup-code-input" id="setup-code-input" placeholder="Enter Phone or Email to share with" maxlength="60" autocapitalize="none" autocomplete="off">
    <input class="setup-code-input" id="setup-pin-input" placeholder="Choose a 4-6 digit PIN" maxlength="6" inputmode="numeric" type="password" autocomplete="off" style="display:none;">
    <button class="setup-join-btn" id="setup-join-btn">Continue</button>
    <p class="setup-error" id="setup-error"></p>
  </div>
</div>
<div id="app" style="display:none;">
  <header>
    <div class="header-row">
      <h1>Talk & Shop List</h1>
      <div class="header-btn-group">
        <button class="clear-btn" id="clear-btn">Clear checked</button>
        <button class="edit-btn notify-text-btn" id="notify-send-btn" aria-label="Send notification">Notify<span class="notify-badge" id="notify-badge"></span></button>
        <button class="edit-btn" id="notif-btn" aria-label="Enable notifications"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        <button class="edit-btn" id="edit-cats-btn" aria-label="Edit categories"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </div>
    <div class="subtitle">
      <span class="dot" id="sync-dot"></span><span id="sync-text">Syncing…</span>
    </div>
    <div class="account-row">
      <span class="code-pill" id="code-pill" title="Tap to copy code"></span>
      <button class="switch-list-btn" id="switch-list-btn">Switch list</button>
    </div>
  </header>
  <main id="list-container">
    <div class="empty" id="empty-state">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;display:block;"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 8H6"/></svg>
      <p>Nothing on the list</p>
      <p class="hint">Type or tap the mic to add something</p>
    </div>
  </main>

  <div class="addbar">
    <div class="chip-row" id="chip-row"></div>
    <div class="addbar-inner">
      <input id="text-input" type="text" placeholder="Add an item" autocorrect="on" autocapitalize="sentences" />
      <button class="send-btn" id="send-btn" aria-label="Add item"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      <button class="lang-btn" id="lang-btn" aria-label="Toggle voice language">EN</button>
      <button class="mic-btn" id="mic-btn" aria-label="Add by voice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var listEl = document.getElementById('list-container');
  var emptyState = document.getElementById('empty-state');
  var input = document.getElementById('text-input');
  var sendBtn = document.getElementById('send-btn');
  var micBtn = document.getElementById('mic-btn');
  var syncDot = document.getElementById('sync-dot');
  var syncText = document.getElementById('sync-text');
  var toastEl = document.getElementById('toast');
  var items = [];
  var pollTimer = null;
  var clearBtn = document.getElementById('clear-btn');
  var editCatsBtn = document.getElementById('edit-cats-btn');
  var chipRow = document.getElementById('chip-row');

  var OTHER_CAT = { id: 'other', label: 'Other', icon: '🏷️' };
  var categories = [];
  var forcedCategory = null;
  var editingCats = false;
  var ICONS = ['🏷️','🍎','🥚','🐟','🍞','🫙','❄️','🧴','🥕','☕','🧃','🧀','🥩','💊','🐾'];

  function slugify(label) {
    var base = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    var id = base || 'cat';
    var i = 1;
    while (categories.concat([OTHER_CAT]).some(function (c) { return c.id === id; })) {
      id = base + '-' + (++i);
    }
    return id;
  }

  function catInfo(id) {
    if (id === 'other' || !id) return OTHER_CAT;
    var found = categories.filter(function (c) { return c.id === id; })[0];
    return found || OTHER_CAT;
  }

  function addCategory() {
    var name = window.prompt('New category name (e.g. Produce, Snacks, Errands)');
    if (!name) return;
    name = name.trim();
    if (!name) return;
    var icon = ICONS[categories.length % ICONS.length];
    var cat = { id: slugify(name), label: name, icon: icon };
    categories.push(cat);
    forcedCategory = cat.id;
    persistCategories();
    renderChips();
  }

  function removeCategory(id) {
    categories = categories.filter(function (c) { return c.id !== id; });
    items.forEach(function (it) { if (it.category === id) it.category = 'other'; });
    if (forcedCategory === id) forcedCategory = null;
    persistCategories();
    persist();
    renderChips();
    render();
  }

  function renameCategory(cat) {
    var name = window.prompt('Rename category', cat.label);
    if (!name) return;
    name = name.trim();
    if (!name || name === cat.label) return;
    cat.label = name;
    persistCategories();
    renderChips();
    render();
  }

  function renderChips() {
    chipRow.innerHTML = '';
    var all = categories.concat([OTHER_CAT]);
    all.forEach(function (cat) {
      var chip = document.createElement('button');
      var isEditable = editingCats && cat.id !== 'other';
      chip.className = 'chip' + (forcedCategory === cat.id ? ' active' : '') + (isEditable ? ' removable' : '');
      chip.innerHTML = '<span>' + cat.icon + '</span><span class="chip-label">' + cat.label + '</span>' + (isEditable ? ' <svg class="chip-del" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' : '');
      if (isEditable) {
        chip.addEventListener('click', function (e) {
          if (e.target.closest('.chip-del')) {
            if (window.confirm('Remove "' + cat.label + '"? Items in it move to Other.')) removeCategory(cat.id);
          } else {
            renameCategory(cat);
          }
        });
      } else {
        chip.addEventListener('click', function () {
          forcedCategory = (forcedCategory === cat.id) ? null : cat.id;
          renderChips();
        });
      }
      chipRow.appendChild(chip);
    });
    var addChip = document.createElement('button');
    addChip.className = 'chip add';
    addChip.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add category';
    addChip.addEventListener('click', addCategory);
    chipRow.appendChild(addChip);
  }

  editCatsBtn.addEventListener('click', function () {
    editingCats = !editingCats;
    editCatsBtn.classList.toggle('active', editingCats);
    renderChips();
  });

  var notifBtn = document.getElementById('notif-btn');
  function updateNotifBtnState() {
    if (!('Notification' in window)) { notifBtn.style.display = 'none'; return; }
    notifBtn.classList.toggle('active', Notification.permission === 'granted');
  }
  notifBtn.addEventListener('click', function () {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      showToast('Notifications are already on');
      return;
    }
    if (Notification.permission === 'denied') {
      showToast('Notifications blocked — enable in phone Settings');
      return;
    }
    Notification.requestPermission().then(function (perm) {
      updateNotifBtnState();
      showToast(perm === 'granted' ? 'Notifications turned on' : 'Notifications not enabled');
    });
  });
  updateNotifBtnState();

  var notifySendBtn = document.getElementById('notify-send-btn');
  var notifyBadge = document.getElementById('notify-badge');
  function updateNotifyBtnState() {
    var n = pendingNotifyItems.length;
    notifyBadge.classList.toggle('show', n > 0);
    notifyBadge.textContent = n > 9 ? '9+' : String(n);
    notifySendBtn.setAttribute('aria-label', n > 0 ? 'Send notification (' + n + ' pending)' : 'Send notification');
  }
  notifySendBtn.addEventListener('click', function () {
    if (pendingNotifyItems.length === 0) { showToast('Nothing new to notify about'); return; }
    sendNotifyPing();
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function setSyncState(ok) {
    syncDot.classList.toggle('off', !ok);
    syncText.textContent = ok ? 'Synced with your list' : 'Offline, retrying…';
  }

  function timeAgo(ts) {
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }

  function makeRow(it) {
    var row = document.createElement('div');
    row.className = 'item' + (it.done ? ' done' : '');
    row.innerHTML =
      '<button class="check" aria-label="Toggle done"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>' +
      '<div class="item-text"></div>' +
      '<button class="del-btn" aria-label="Delete"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    row.querySelector('.item-text').textContent = it.text;
    row.querySelector('.check').addEventListener('click', function () { toggleItem(it.id); });
    row.querySelector('.del-btn').addEventListener('click', function () { deleteItem(it.id); });
    return row;
  }

  function render() {
    try {
      listEl.querySelectorAll('.item, .section-title').forEach(function (el) { el.remove(); });
      if (items.length === 0) {
        emptyState.style.display = 'block';
        clearBtn.classList.remove('show');
        return;
      }
      emptyState.style.display = 'none';

      var active = items.filter(function (x) { return !x.done; });
      var checked = items.filter(function (x) { return x.done; });
      clearBtn.classList.toggle('show', checked.length > 0);
      clearBtn.textContent = 'Clear checked (' + checked.length + ')';

      var allCats = categories.concat([OTHER_CAT]);
      allCats.forEach(function (cat) {
        var inCat = active.filter(function (x) { return (x.category || 'other') === cat.id; })
          .sort(function (a, b) { return b.addedAt - a.addedAt; });
        if (inCat.length === 0) return;
        var title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = cat.label;
        listEl.appendChild(title);
        inCat.forEach(function (it) { listEl.appendChild(makeRow(it)); });
      });

      if (checked.length > 0) {
        var ctitle = document.createElement('div');
        ctitle.className = 'section-title checked';
        ctitle.textContent = 'Checked off';
        listEl.appendChild(ctitle);
        checked.sort(function (a, b) { return b.addedAt - a.addedAt; })
          .forEach(function (it) { listEl.appendChild(makeRow(it)); });
      }
    } catch (e) {
      showToast('Something glitched, tap to retry');
    }
  }

  var FIREBASE_URL = 'https://my-shopping-app-4dfc4-default-rtdb.firebaseio.com';
  var LIST_CODE = null;
  function listUrl(name) { return FIREBASE_URL + '/lists/' + LIST_CODE + '/' + name + '.json'; }

  var persistDebounceTimer = null;
  var writeInFlight = null;
  var writePending = false;
  var localVersion = 0;

  function queueWrite() {
    if (writeInFlight) { writePending = true; return writeInFlight; }
    var v = Date.now();
    if (v <= localVersion) v = localVersion + 1;
    localVersion = v;
    writeInFlight = fetch(listUrl('list'), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ v: v, items: items })
    })
      .then(function (r) { if (!r.ok) throw new Error('write failed'); setSyncState(true); }, function () { setSyncState(false); })
      .then(function () {
        var wasPending = writePending;
        writePending = false;
        writeInFlight = null;
        if (wasPending) queueWrite();
      });
    return writeInFlight;
  }

  function waitForWritesSettled() {
    if (!writeInFlight) return Promise.resolve();
    return writeInFlight.then(waitForWritesSettled);
  }

  function persistImmediate() {
    if (persistDebounceTimer) { clearTimeout(persistDebounceTimer); persistDebounceTimer = null; }
    queueWrite();
    return waitForWritesSettled();
  }

  function persist() {
    if (persistDebounceTimer) clearTimeout(persistDebounceTimer);
    persistDebounceTimer = setTimeout(function () {
      persistDebounceTimer = null;
      queueWrite();
    }, 500);
  }

  var catWriteInFlight = null;
  var catWritePending = false;
  var catLocalVersion = 0;

  function queueCatWrite() {
    if (catWriteInFlight) { catWritePending = true; return catWriteInFlight; }
    var v = Date.now();
    if (v <= catLocalVersion) v = catLocalVersion + 1;
    catLocalVersion = v;
    catWriteInFlight = fetch(listUrl('cats'), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ v: v, categories: categories })
    })
      .then(function () {}, function () {})
      .then(function () {
        var wasPending = catWritePending;
        catWritePending = false;
        catWriteInFlight = null;
        if (wasPending) queueCatWrite();
      });
    return catWriteInFlight;
  }

  function persistCategories() {
    queueCatWrite();
  }

  function loadCategories() {
    if (catWriteInFlight) return Promise.resolve();
    return fetch(listUrl('cats'))
      .then(function (r) { return r.json(); })
      .then(function (parsed) {
        if (parsed) {
          var remoteCats = parsed.categories || [];
          var remoteV = parsed.v || 0;
          if (remoteV >= catLocalVersion) {
            categories = remoteCats;
            catLocalVersion = remoteV;
          }
        }
      }).catch(function () {});
  }

  var deviceId = 'd' + Date.now() + Math.random().toString(36).slice(2, 8);
  var lastSeenPingV = null;
  var pendingNotifyItems = [];

  function checkPing(pingData) {
    if (!pingData) { lastSeenPingV = lastSeenPingV || 0; return; }
    if (lastSeenPingV === null) { lastSeenPingV = pingData.v || 0; return; }
    if ((pingData.v || 0) > lastSeenPingV && pingData.by !== deviceId) {
      lastSeenPingV = pingData.v;
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        var texts = pingData.items || [];
        var body = texts.length === 0 ? 'Check the list for new items'
          : texts.length <= 3 ? texts.join(', ')
          : texts.slice(0, 3).join(', ') + ' +' + (texts.length - 3) + ' more';
        try { new Notification('Talk & Shop List updated', { body: body, silent: false, vibrate: [200, 100, 200] }); } catch (e) {}
      }
    } else if ((pingData.v || 0) > lastSeenPingV) {
      lastSeenPingV = pingData.v;
    }
  }

  function sendNotifyPing() {
    var texts = pendingNotifyItems.map(function (it) { return it.text; });
    var v = Date.now();
    fetch(listUrl('ping'), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ v: v, by: deviceId, items: texts })
    }).then(function () {
      lastSeenPingV = v;
      pendingNotifyItems = [];
      updateNotifyBtnState();
      showToast('Notified!');
    }).catch(function () {
      showToast('Could not send notification, try again');
    });
  }

  function load(showLoadingState) {
    if (writeInFlight) { setSyncState(true); return; }
    Promise.all([
      fetch(listUrl('list')).then(function (r) { return r.json(); }).catch(function () { return null; }),
      fetch(listUrl('ping')).then(function (r) { return r.json(); }).catch(function () { return null; }),
      loadCategories()
    ]).then(function (results) {
      var parsed = results[0];
      if (parsed) {
        var remoteItems = parsed.items || [];
        var remoteV = parsed.v || 0;
        if (remoteV >= localVersion) {
          items = remoteItems;
          localVersion = remoteV;
        }
      }
      checkPing(results[1]);
      setSyncState(true);
      renderChips();
      render();
    }).catch(function () {
      setSyncState(false);
    });
  }

  function addItem(text) {
    text = text.trim();
    if (!text) return;
    var category = forcedCategory || 'other';
    var newItem = { id: 'i' + Date.now() + Math.random().toString(36).slice(2, 6), text: text, done: false, category: category, addedAt: Date.now() };
    items.push(newItem);
    pendingNotifyItems.push(newItem);
    updateNotifyBtnState();
    render();
    persist();
    showToast('Added "' + text + '"');
  }

  function toggleItem(id) {
    var it = items.find(function (x) { return x.id === id; });
    if (it) { it.done = !it.done; render(); persist(); }
  }

  function deleteItem(id) {
    items = items.filter(function (x) { return x.id !== id; });
    render();
    persist();
  }

  function clearChecked() {
    var count = items.filter(function (x) { return x.done; }).length;
    if (count === 0) return;
    items = items.filter(function (x) { return !x.done; });
    render();
    persist();
    showToast('Cleared ' + count + ' item' + (count === 1 ? '' : 's'));
  }

  clearBtn.addEventListener('click', clearChecked);

  input.addEventListener('input', function () {
    sendBtn.classList.toggle('show', input.value.trim().length > 0);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { addItem(input.value); input.value = ''; sendBtn.classList.remove('show'); }
  });
  sendBtn.addEventListener('click', function () {
    addItem(input.value); input.value = ''; sendBtn.classList.remove('show');
  });

  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRec) {
    var recognition = new SpeechRec();
    recognition.continuous = false;
    recognition.interimResults = false;
    var currentLang = 'en-US';
    recognition.lang = currentLang;
    var listening = false;
    var manualStop = false;
    var listenTimeout = null;
    var SESSION_MS = 45000;

    function stopListeningUI() {
      listening = false;
      micBtn.classList.remove('listening');
      if (listenTimeout) { clearTimeout(listenTimeout); listenTimeout = null; }
      persistImmediate().then(function () {
        if (!pollTimer) pollTimer = setInterval(function () { load(); }, 4000);
      });
    }

    recognition.onresult = function (event) {
      for (var i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          var transcript = event.results[i][0].transcript;
          transcript.split(/,|\.|;| and | also | plus | then /i).forEach(function (part) {
            if (part.trim()) addItem(part.trim());
          });
        }
      }
    };
    recognition.onerror = function (event) {
      if (event.error !== 'no-speech') {
        showToast('Didn\'t catch that, try again');
      }
    };
    recognition.onend = function () {
      if (listening && !manualStop) {
        setTimeout(function () {
          if (!listening || manualStop) return;
          try {
            recognition.start();
          } catch (e) {
            setTimeout(function () {
              if (!listening || manualStop) return;
              try { recognition.start(); } catch (e2) { stopListeningUI(); }
            }, 300);
          }
        }, 150);
        return;
      }
      stopListeningUI();
    };

    micBtn.addEventListener('click', function () {
      input.blur();
      if (listening) {
        manualStop = true;
        try { recognition.stop(); } catch (e) {}
        stopListeningUI();
        return;
      }
      try {
        manualStop = false;
        recognition.lang = currentLang;
        recognition.start();
        listening = true;
        micBtn.classList.add('listening');
        showToast('Listening… tap again to stop');
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        listenTimeout = setTimeout(function () {
          manualStop = true;
          try { recognition.stop(); } catch (e) {}
          stopListeningUI();
        }, SESSION_MS);
      } catch (e) {
        stopListeningUI();
      }
    });

    var langBtn = document.getElementById('lang-btn');
    if (langBtn) {
      langBtn.addEventListener('click', function () {
        currentLang = (currentLang === 'en-US') ? 'ml-IN' : 'en-US';
        langBtn.textContent = (currentLang === 'ml-IN') ? 'മല' : 'EN';
        showToast(currentLang === 'ml-IN' ? 'Voice set to Malayalam' : 'Voice set to English');
      });
    }
  } else {
    micBtn.style.display = 'none';
    var langBtnHide = document.getElementById('lang-btn');
    if (langBtnHide) langBtnHide.style.display = 'none';
  }

  if (window.visualViewport) {
    var addbarEl = document.querySelector('.addbar');
    function adjustForKeyboard() {
      var vv = window.visualViewport;
      var offset = window.innerHeight - vv.height - vv.offsetTop;
      addbarEl.style.transform = offset > 0 ? 'translateY(-' + offset + 'px)' : '';
    }
    window.visualViewport.addEventListener('resize', adjustForKeyboard);
    window.visualViewport.addEventListener('scroll', adjustForKeyboard);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && LIST_CODE) load();
  });

  function sanitizeKey(raw) {
    return raw.trim().toLowerCase().replace(/[.#$\[\]\/\s+\-()]/g, '');
  }

  function hashPin(pin, salt) {
    var enc = new TextEncoder().encode(salt + ':pin:' + pin);
    return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }

  var setupScreen = document.getElementById('setup-screen');
  var appRoot = document.getElementById('app');
  var codePill = document.getElementById('code-pill');
  var switchListBtn = document.getElementById('switch-list-btn');
  var setupSub = document.getElementById('setup-sub');
  var setupJoinBtn = document.getElementById('setup-join-btn');
  var setupCodeInput = document.getElementById('setup-code-input');
  var setupPinInput = document.getElementById('setup-pin-input');
  var setupError = document.getElementById('setup-error');
  var pendingKey = null;
  var pendingRaw = null;
  var setupStep = 'identify';

  function startAppWithCode(code, rawDisplay) {
    LIST_CODE = code;
    localStorage.setItem('shoppingListCode', code);
    localStorage.setItem('shoppingListCodeDisplay', rawDisplay || code);
    setupScreen.style.display = 'none';
    appRoot.style.display = '';
    codePill.textContent = rawDisplay || code;
    load();
    pollTimer = setInterval(function () { load(); }, 4000);
  }

  function resetToIdentifyStep() {
    setupStep = 'identify';
    setupCodeInput.style.display = '';
    setupPinInput.style.display = 'none';
    setupPinInput.value = '';
    setupJoinBtn.textContent = 'Continue';
    setupSub.textContent = 'Enter your phone number or email — this becomes your personal list. Use the same one next time to come back to it.';
    setupError.textContent = '';
  }

  codePill.addEventListener('click', function () {
    var display = localStorage.getItem('shoppingListCodeDisplay') || LIST_CODE;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(display).then(function () {
        showToast('Copied: ' + display);
      }).catch(function () { showToast(display); });
    } else {
      showToast(display);
    }
  });

  switchListBtn.addEventListener('click', function () {
    if (window.confirm('Switch to a different list?')) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      localStorage.removeItem('shoppingListCode');
      localStorage.removeItem('shoppingListCodeDisplay');
      LIST_CODE = null;
      items = [];
      categories = [];
      appRoot.style.display = 'none';
      setupScreen.style.display = 'flex';
      setupCodeInput.value = '';
      resetToIdentifyStep();
    }
  });

  function handleIdentifyStep() {
    var raw = setupCodeInput.value.trim();
    var key = sanitizeKey(raw);
    if (key.length < 4) {
      setupError.textContent = 'Enter a valid phone number or email';
      return;
    }
    setupError.textContent = '';
    setupJoinBtn.disabled = true;
    fetch(FIREBASE_URL + '/lists/' + key + '/pin.json')
      .then(function (r) { return r.json(); })
      .then(function (pinData) {
        setupJoinBtn.disabled = false;
        pendingKey = key;
        pendingRaw = raw;
        if (pinData && pinData.hash) {
          setupStep = 'verify';
          setupCodeInput.style.display = 'none';
          setupPinInput.style.display = '';
          setupPinInput.placeholder = 'Enter the PIN for this list';
          setupPinInput.value = '';
          setupSub.textContent = 'This list is protected. Enter its PIN to continue.';
          setupJoinBtn.textContent = 'Unlock';
          setupPinInput.focus();
        } else {
          setupStep = 'create';
          setupCodeInput.style.display = 'none';
          setupPinInput.style.display = '';
          setupPinInput.placeholder = 'Choose a 4-6 digit PIN';
          setupPinInput.value = '';
          setupSub.textContent = 'Set a PIN to protect this list — anyone joining will need it.';
          setupJoinBtn.textContent = 'Set PIN & Continue';
          setupPinInput.focus();
        }
      })
      .catch(function () {
        setupJoinBtn.disabled = false;
        setupError.textContent = 'Could not reach the server, try again';
      });
  }

  function handleVerifyStep() {
    var pin = setupPinInput.value.trim();
    if (!pin) { setupError.textContent = 'Enter the PIN'; return; }
    setupJoinBtn.disabled = true;
    hashPin(pin, pendingKey).then(function (hash) {
      fetch(FIREBASE_URL + '/lists/' + pendingKey + '/pin.json')
        .then(function (r) { return r.json(); })
        .then(function (pinData) {
          setupJoinBtn.disabled = false;
          if (pinData && pinData.hash === hash) {
            startAppWithCode(pendingKey, pendingRaw);
          } else {
            setupError.textContent = 'Incorrect PIN, try again';
          }
        });
    });
  }

  function handleCreateStep() {
    var pin = setupPinInput.value.trim();
    if (pin.length < 4 || pin.length > 6 || !/^\d+$/.test(pin)) {
      setupError.textContent = 'PIN must be 4-6 digits';
      return;
    }
    setupJoinBtn.disabled = true;
    hashPin(pin, pendingKey).then(function (hash) {
      return fetch(FIREBASE_URL + '/lists/' + pendingKey + '/pin.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hash: hash })
      });
    }).then(function () {
      setupJoinBtn.disabled = false;
      startAppWithCode(pendingKey, pendingRaw);
    }).catch(function () {
      setupJoinBtn.disabled = false;
      setupError.textContent = 'Could not save PIN, try again';
    });
  }

  setupJoinBtn.addEventListener('click', function () {
    if (setupStep === 'identify') handleIdentifyStep();
    else if (setupStep === 'verify') handleVerifyStep();
    else if (setupStep === 'create') handleCreateStep();
  });

  setupCodeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') setupJoinBtn.click();
  });
  setupPinInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') setupJoinBtn.click();
  });

  var storedCode = localStorage.getItem('shoppingListCode');
  if (storedCode) {
    startAppWithCode(storedCode, localStorage.getItem('shoppingListCodeDisplay'));
  } else {
    setupScreen.style.display = 'flex';
    appRoot.style.display = 'none';
  }
})();
</script>
</body>
</html>
